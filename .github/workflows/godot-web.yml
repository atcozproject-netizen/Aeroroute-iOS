name: Build and publish Aeroroute (Godot)

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/**"
      - "scenes/**"
      - "data/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/godot-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aeroroute-pages
  cancel-in-progress: true

jobs:
  web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Godot game
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install illustration tool
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validate game data
        run: |
          python tests/validate_data.py
          python tools/build_assets.py
          python tools/build_detail_tiles.py
          if [ -f tests/validate_v09_static.py ]; then
            python tests/validate_v09_static.py
          fi
          if [ -f tools/build_firs.py ]; then
            python tools/build_firs.py
          fi

      - name: Cache Godot engine and Web templates
        uses: actions/cache@v4
        with:
          path: |
            .godot-build-cache
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: godot-4.5.1-singlethread-web-v2

      - name: Compile actual Godot game
        run: python tools/build_web.py

      - name: Verify start-screen search and button hit-testing
        run: ./.godot-build-cache/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/gui_interaction_smoke.gd

      - name: Adapt mobile webpage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('build/index.html')
          html=p.read_text()
          html=html.replace('width=device-width, user-scalable=no, initial-scale=1.0',
                            'width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no')
          responsive_css = """
          <style id="aeroroute-responsive-game">
            html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
            #canvas { display: block; touch-action: none; }
            body { background: #16394b; }
          </style>
          """
          pwa_meta = """<meta name="theme-color" content="#16394b">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="Aeroroute">
          <link rel="manifest" href="manifest.webmanifest">"""
          html=html.replace('</head>', responsive_css + pwa_meta + '</head>')
          p.write_text(html)
          import json
          (Path('build')/'manifest.webmanifest').write_text(json.dumps({
            'name':'Aeroroute — Airline Empire', 'short_name':'Aeroroute',
            'display':'standalone', 'start_url':'./', 'scope':'./',
            'background_color':'#16394b', 'theme_color':'#16394b',
            'orientation':'any'
          }, ensure_ascii=False))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload playable Godot build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
